server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Angular Router: permite refrescar /dashboard, /productos, /ventas, /pagos
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Configuración externa del frontend: evitar caché agresivo
    location = /config/app-config.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
        try_files $uri =404;
    }
}

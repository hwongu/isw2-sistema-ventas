<mat-toolbar class="topbar">
  @if (isHandset()) {
    <button mat-icon-button (click)="drawer.toggle()" aria-label="Abrir menú"><mat-icon>menu</mat-icon></button>
  }
  <span class="brand-mark" aria-hidden="true"></span><span class="brand">Sistema de Ventas</span>
  <span class="toolbar-spacer"></span><span class="service-label">Ventas · Pagos</span>
</mat-toolbar>
<mat-sidenav-container class="layout">
  <mat-sidenav #drawer class="sidebar" [mode]="isHandset() ? 'over' : 'side'" [opened]="!isHandset()">
    <div class="sidebar-heading"><span>Navegación</span></div>
    <mat-nav-list>
      @for (item of menu; track item.route) {
        <a mat-list-item [routerLink]="item.route" routerLinkActive="active-link" ariaCurrentWhenActive="page" (click)="isHandset() && drawer.close()">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon><span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
    <div class="sidebar-footer"><span>Entorno académico</span><small>Angular + Java</small></div>
  </mat-sidenav>
  <mat-sidenav-content><main class="content"><router-outlet></router-outlet></main></mat-sidenav-content>
</mat-sidenav-container>
